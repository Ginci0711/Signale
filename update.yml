name: Signale aktualisieren

on:
  schedule:
    # täglich um 06:00 UTC (= 07:00/08:00 deutscher Zeit, je nach Sommerzeit)
    - cron: "0 6 * * *"
  workflow_dispatch: {}   # erlaubt manuelles Starten über den "Actions"-Tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Signale berechnen
        run: python signale.py --json docs/results.json

      - name: Ergebnis committen
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/results.json
          git diff --quiet --cached || git commit -m "Signale aktualisiert: $(date -u +%Y-%m-%d)"
          git push
